name: Build EvoluMC Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Build exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Désactive la publication automatique (on utilise upload-artifact)
          EP_PRE_RELEASE: false
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build-win

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: EvoluMC-Launcher-Windows
          path: dist/*.exe
          retention-days: 30
